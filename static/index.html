<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripMind AI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">AI travel planner</p>
          <h1>TripMind AI</h1>
        </div>
        <button id="loadSample" class="ghost-btn">Load sample</button>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Build a route</h2>
          <form id="tripForm">
            <label>
              Destination
              <input type="text" name="destination" value="Rome" />
            </label>

            <div class="two-cols">
              <label>
                Days
                <input type="number" name="days" min="2" max="10" value="3" />
              </label>
              <label>
                Budget
                <input type="number" name="budget" min="500" step="50" value="1800" />
              </label>
            </div>

            <div class="two-cols">
              <label>
                Travellers
                <input type="number" name="travellers" min="1" max="8" value="2" />
              </label>
              <label>
                Pace
                <select name="pace">
                  <option value="relaxed">Relaxed</option>
                  <option value="balanced" selected>Balanced</option>
                  <option value="fast">Fast</option>
                </select>
              </label>
            </div>

            <label>
              Weather
              <select name="weather">
                <option value="sunny">Sunny</option>
                <option value="rainy" selected>Rainy</option>
                <option value="cloudy">Cloudy</option>
              </select>
            </label>

            <fieldset>
              <legend>Interests</legend>
              <div class="checkbox-row">
                <label><input type="checkbox" name="interests" value="culture" checked /> Culture</label>
                <label><input type="checkbox" name="interests" value="food" checked /> Food</label>
                <label><input type="checkbox" name="interests" value="nature" /> Nature</label>
                <label><input type="checkbox" name="interests" value="adventure" /> Adventure</label>
              </div>
            </fieldset>

            <label>
              Scenario
              <select name="scenario">
                <option value="econom">Econom</option>
                <option value="comfort" selected>Comfort</option>
                <option value="premium">Premium</option>
              </select>
            </label>

            <button type="submit" class="primary-btn">Generate itinerary</button>
          </form>
        </section>

        <section class="panel results-panel">
          <div id="summary"></div>
          <div id="weatherNote" class="weather-note"></div>

          <div class="section-block quality-block">
            <h3>Travel quality</h3>
            <div id="travelScore" class="travel-score"></div>
            <ul id="insightsList" class="insights-list"></ul>
          </div>

          <div class="section-block">
            <h3>Необходимые вещи для упаковки</h3>
            <ul id="packingList" class="packing-list"></ul>
          </div>

          <div class="section-block">
            <h3>Лучшее время для посещения</h3>
            <div id="bestTimeToVisit" class="best-time-box"></div>
          </div>

          <div class="section-block">
            <h3>Разбивка бюджета</h3>
            <div id="budgetBreakdown" class="budget-breakdown"></div>
          </div>

          <div class="section-block">
            <h3>Сравнение сценариев</h3>
            <div id="scenarioGrid" class="scenario-grid"></div>
          </div>

          <div class="section-block">
            <h3>Карта маршрута</h3>
            <ul id="mapList" class="map-list"></ul>
          </div>

          <div class="section-block">
            <h3>ИИ-помощник путешественника</h3>
            <div id="chatBox" class="chat-box"></div>
          </div>
        </section>
      </main>

      <section class="panel itinerary-panel">
        <h2>Daily plan</h2>
        <div id="itinerary" class="itinerary-grid"></div>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
